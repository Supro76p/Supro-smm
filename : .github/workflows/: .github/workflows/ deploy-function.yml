name: Deploy smmgen function

on:
  workflow_dispatch:
  push:
    paths:
      - "supabase/functions/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase init --force || true
      - run: supabase functions deploy smmgen --project-ref cgkiddhxbkuvdyghlpfc
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
